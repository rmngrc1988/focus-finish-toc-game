<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Focus & Finish ToC Game (Web)</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #eee;
      font-family: Consolas, monospace;
    }
    #ui {
      padding: 10px 20px;
    }
    button {
      margin-left: 10px;
      padding: 4px 12px;
      font-size: 14px;
    }
    canvas {
      display: block;
      margin: 0 auto 20px auto;
      background: #000;
      border-top: 1px solid #444;
    }
  </style>
</head>
<body>
  <div id="ui">
    <span id="info"></span>
    <button id="startBtn">START</button>
    <button id="stopBtn">STOP</button>
  </div>
  <canvas id="gameCanvas" width="1200" height="340"></canvas>

  <script src="game.js"></script>
</body>
</html>
